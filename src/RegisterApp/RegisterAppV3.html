<script type="text/javascript">
/**-------------------------FUNCION PARA EL CAMBIO DE VISTSA-----------------------------*/

setTimeout(()=>{

	document.getElementById("window-logo-install-app").classList.replace("container-show-logo","container-hide")

	document.getElementById("window-detail-install-app").classList.replace("container-hide","container-show-detail")

},5000)


/*----------------------CONTROL DEL SLIDECHOW------------------------------------*/
let slideIndex = 0;
showSlides();

function showSlides() {
  let i;
  let slides = document.getElementsByClassName("mySlides");
  let dots = document.getElementsByClassName("dot");
  
  // Ocultar todas las imágenes
  for (i = 0; i < slides.length; i++) {
    slides[i].style.display = "none";  
  }
  
  slideIndex++;
  
  // Reiniciar el índice si llega al final
  if (slideIndex > slides.length) {slideIndex = 1}    
  
  // Quitar la clase "active" de todos los puntos

  for (i = 0; i < dots.length; i++) {
    dots[i].className = dots[i].className.replace(" active", "");
  }
  
  // Mostrar la imagen actual y activar el punto correspondiente
  slides[slideIndex-1].style.display = "block";  
  dots[slideIndex-1].className += " active";
  
  // Ejecutar la función cada 3000ms (3 segundos)
     setTimeout(showSlides, 3000); 

}
/*************************************************************/

document.getElementById("btn-install-system").addEventListener("click",()=>{
  
   api.send("Open-system-Admin-data-register")

</script>
